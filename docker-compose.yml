networks:
  aivideoalarm:
    driver: bridge

services:
  # Frigate is assumed to already be running in this deployment (per
  # docs/adr/0001-extend-not-replace-frigate.md). It is referenced here,
  # not managed by this compose file, so this project doesn't fight with
  # an existing Frigate setup. If you want Frigate itself managed
  # alongside alarm-core, uncomment and adapt a `frigate:` service using
  # the upstream image (ghcr.io/blakeblackshear/frigate) and point
  # FRIGATE_URL below at it instead.

  alarm-core:
    build:
      context: ./services/alarm-core
    image: aivideoalarm/alarm-core:dev
    container_name: aivideoalarm-core
    restart: unless-stopped
    networks:
      - aivideoalarm
    env_file:
      - .env
    environment:
      - FRIGATE_URL=${FRIGATE_URL:-http://frigate.local:5000}
      - MQTT_HOST=${MQTT_HOST:-mosquitto.local}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ARCHIVE_QUOTA_GB=${ARCHIVE_QUOTA_GB:-30}
      - CLOUD_AI_DAILY_CALL_CAP=${CLOUD_AI_DAILY_CALL_CAP:-20}
      - HA_STATESTREAM_BASE_TOPIC=${HA_STATESTREAM_BASE_TOPIC:-homeassistant}
      - CONFIG_PATH=/config/alarm-core.yaml
    volumes:
      - ./config/alarm-core.example.yaml:/config/alarm-core.yaml:ro
      # TODO: point this at the real archive path on the host (same host
      # as Frigate's own recordings, per the archive-retention ADR).
      - ./data/archive:/data/archive
      - ./data/db:/data/db
    ports:
      # FastAPI health/API + static media, proxied by the HA add-on rather
      # than exposed directly to the internet.
      - "8090:8090"
    # NVIDIA GPU passthrough for Tier-1 local inference: uncomment once the
    # NVIDIA Container Toolkit is installed on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # alarm-media is folded into alarm-core's FastAPI static mount for now
  # (see docs/adr/0004-archive-retention-design.md). Split into its own
  # lightweight nginx service later if load warrants it.
