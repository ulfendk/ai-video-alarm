[project]
name = "aivideoalarm-core"
version = "0.1.0"
description = "Secondary verification and alarm-orchestration layer on top of Frigate, for Home Assistant."
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "anthropic>=0.34",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    # ONNX Runtime backs Tier-1 local inference (CPU by default; swap for
    # onnxruntime-gpu once the NVIDIA Container Toolkit is set up on the
    # host — see docker-compose.yml).
    "onnxruntime>=1.19",
    "numpy>=1.26",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# DTZ: this service intentionally uses naive local time throughout (zone
# time-window rules like "07:00-09:00", the night-hour window, and the
# daily Tier-2 call budget's day boundary are all meant in the host's
# local wall-clock time, not UTC).
ignore = ["DTZ"]
